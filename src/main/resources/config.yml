# Конфигурация TestPing

ping:
  # Количество запросов за одно выполнение команды
  # (стандартный Windows ping отправляет 4)
  count: 4

  # Таймаут одного запроса в миллисекундах.
  # Один запрос не может висеть дольше этого времени.
  timeout: 3000

  # Пауза между запросами в миллисекундах
  # (Windows ping тоже ждёт ~1 секунду между пакетами).
  interval: 1000

cooldown:
  # Пауза между использованиями команды для игрока, в секундах.
  # На консоль сервера кулдаун не действует.
  seconds: 5
